# The C table from outside (design §7, Stage 6): the public headers compile
# on their own, and tools/zupixtest, a minimal consumer, resolves the table
# through zupix-r.h and checks decode, metadata and encode against zupix's
# R functions, on all three OSes.
on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - '_pkgdown.yml'
      - '.agents/**'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - '_pkgdown.yml'
      - '.agents/**'
      - 'docs/**'

name: abi

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  standalone-header:
    runs-on: ${{ matrix.os }}
    name: zupix.h standalone (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
      - name: compiles as C99 and C11 with no R and no vendored header
        run: |
          printf '#include <zupix.h>\nint main(void){return 0;}\n' > probe.c
          for std in c99 c11; do
            cc -std=$std -Wall -Wextra -Wpedantic -Werror \
               -Iinst/include -c probe.c -o /dev/null
            echo "ok  $std"
          done
      - name: compiles as C++ through the extern "C" wrapper
        run: |
          printf '#include <zupix.h>\nint main(){return 0;}\n' > probe.cpp
          c++ -std=c++11 -Wall -Wextra -Werror -Iinst/include \
              -c probe.cpp -o /dev/null
          echo "ok  C++"
      - name: a consumer of zupix-r.h compiles with -Werror
        run: |
          cat > consumer.c <<'C'
          #include <zupix-r.h>
          SEXP probe(void) {
            const zupix_api_v1 *api = zupix_api();
            return Rf_ScalarLogical(api != NULL);
          }
          C
          cc -std=c99 -Wall -Wextra -Werror -Iinst/include \
             -I"$(Rscript -e 'cat(R.home("include"))')" \
             -c consumer.c -o /dev/null
          echo "ok  zupix-r.h"

  consumer:
    runs-on: ${{ matrix.os }}
    name: tools/zupixtest calls the table (${{ matrix.os }})
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat
          needs: check
      - name: install zupix
        run: R CMD INSTALL .
      - name: install the consumer
        run: R CMD INSTALL tools/zupixtest
      - name: run the consumer's tests
        run: |
          cat > run-consumer-tests.R <<'R'
          results <- as.data.frame(testthat::test_local(
            "tools/zupixtest", reporter = "summary", load_package = "installed"))
          if (nrow(results) == 0L || sum(results$passed) == 0L) {
            stop("no consumer tests ran")
          }
          quit(status = as.integer(any(results$failed > 0 | results$error)))
          R
          Rscript run-consumer-tests.R
