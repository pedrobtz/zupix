# Guards the vendored sources under src/vendor/: runs tools/vendor/verify,
# and on pull requests fails when a vendored file changes without
# tools/vendor/manifest.tsv and tools/vendor/checksums.sha256 changing too.
on:
  # No `push:`: a pull request already checks its merge with main,
  # and the schedule checks main (r-actions README, "Pushes to main").
  schedule:
    - cron: "24 14 * * 0"
  workflow_dispatch:
  pull_request:

name: vendor

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  vendor:
    uses: pedrobtz/r-actions/.github/workflows/vendor.yml@v1
