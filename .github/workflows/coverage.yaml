on:
  push:
    branches: [main, master]
  pull_request:

name: coverage

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  coverage:
    # Pinned to a commit, not to @v1. This is the one job that runs with a
    # repository write token, and a tag is mutable: whoever can move v1 can
    # change what runs here. Update deliberately, with the tag it matches.
    uses: pedrobtz/r-actions/.github/workflows/coverage.yml@8caf5119301bb2a3bd433b92045b8c75b3097096 # v1.24.0
    permissions:
      contents: write
    with:
      # main takes changes only through pull requests, so the badge commit
      # goes to gh-pages, which already takes the pkgdown deploy's pushes.
      badge-branch: gh-pages
      badge-path: badges/coverage.svg
